<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Enchanted Rose</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:linear-gradient(180deg,#050816,#130f40,#2c003e);
font-family:Arial,sans-serif;
}

#scene{
position:fixed;
width:100%;
height:100%;
}

.overlay{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
pointer-events:none;
}

h1{
color:white;
font-size:55px;
text-shadow:0 0 20px hotpink;
margin-bottom:20px;
}

p{
color:white;
font-size:22px;
max-width:700px;
text-align:center;
padding:20px;
line-height:1.8;
}

button{
pointer-events:auto;
margin-top:25px;
padding:16px 40px;
font-size:20px;
border:none;
border-radius:40px;
background:linear-gradient(45deg,#ff4d6d,#ff9a9e);
color:white;
cursor:pointer;
box-shadow:0 0 25px hotpink;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.petal{
position:absolute;
font-size:24px;
animation:fall linear infinite;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
opacity:1;
}
to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div id="scene"></div>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8d6b2fca8c.mp3?filename=romantic-piano-110624.mp3">
</audio>

<div class="overlay">
<h1>🌹 The Enchanted Rose</h1>

<p>
Just like this glowing rose, may your happiness bloom every single day.
May every tomorrow bring you peace, success, and reasons to smile.
</p>

<button onclick="location.href='memories.html'">
Continue ✨
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>

<script>

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});

renderer.setSize(window.innerWidth,window.innerHeight);

document.getElementById("scene").appendChild(renderer.domElement);

const light=new THREE.PointLight(0xff66aa,4);
light.position.set(3,3,3);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,.8));

const geometry=new THREE.IcosahedronGeometry(1.2,2);

const material=new THREE.MeshPhysicalMaterial({
color:0xff2e63,
transmission:.4,
roughness:.1,
metalness:.2,
clearcoat:1,
emissive:0xff0077,
emissiveIntensity:.5
});

const rose=new THREE.Mesh(geometry,material);

scene.add(rose);

camera.position.z=4;

function animate(){

requestAnimationFrame(animate);

rose.rotation.y+=0.01;
rose.rotation.x+=0.003;

renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});

setInterval(()=>{

const p=document.createElement("div");

p.className="petal";

p.innerHTML=["🌸","🌹","💖"][Math.floor(Math.random()*3)];

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(p);

setTimeout(()=>p.remove(),10000);

},250);

</script>

</body>
</html>
