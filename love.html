<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Love Meter ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#020024,#090979,#1b1b5e,#0f2027);
background-size:400% 400%;
animation:bg 12s infinite alternate;

}

@keyframes bg{

0%{background-position:0% 50%;}
100%{background-position:100% 50%;}

}

canvas{
position:fixed;
inset:0;
}

.box{

position:relative;

z-index:2;

width:90%;
max-width:700px;

padding:45px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border-radius:30px;

box-shadow:0 0 40px rgba(255,255,255,.25);

text-align:center;

color:white;

}

h1{

font-size:50px;

margin-bottom:20px;

text-shadow:0 0 20px hotpink;

}

p{

font-size:20px;

line-height:1.8;

margin-bottom:30px;

}

.meter{

height:28px;

background:#ffffff30;

border-radius:50px;

overflow:hidden;

}

.fill{

height:100%;

width:0;

background:linear-gradient(90deg,#ff0066,#ff6ec7,#ffd700);

transition:6s;

}

.percent{

font-size:45px;

margin:25px 0;

font-weight:bold;

}

button{

padding:15px 45px;

border:none;

border-radius:40px;

font-size:18px;

cursor:pointer;

background:linear-gradient(45deg,#ff2e63,#ff8fab);

color:white;

}

button:hover{

transform:scale(1.05);

}

</style>

</head>

<body>

<canvas id="stars"></canvas>

<audio autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2023/03/14/audio_6f5dcbf5bb.mp3">
</audio>

<div class="box">

<h1>❤️ Happiness Meter ❤️</h1>

<p>

Every smile makes this heart shine brighter.

</p>

<div class="meter">

<div class="fill"></div>

</div>

<div class="percent" id="number">

0%

</div>

<button onclick="start()">

Fill My Wishes ✨

</button>

</div>

<script>

function start(){

document.querySelector(".fill").style.width="100%";

let n=0;

const timer=setInterval(()=>{

n++;

document.getElementById("number").innerHTML=n+"%";

if(n>=100){

clearInterval(timer);

speechSynthesis.speak(

new SpeechSynthesisUtterance(

"May your life always be filled with happiness, success and beautiful smiles."

)

);

setTimeout(()=>{

location.href="gift.html";

},3000);

}

},60);

}

const canvas=document.getElementById("stars");

const ctx=canvas.getContext("2d");

canvas.width=innerWidth;

canvas.height=innerHeight;

let stars=[];

for(let i=0;i<250;i++){

stars.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

r:Math.random()*2

});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

ctx.beginPath();

ctx.arc(s.x,s.y,s.r,0,Math.PI*2);

ctx.fill();

s.y+=0.2;

if(s.y>canvas.height)s.y=0;

});

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
