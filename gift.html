<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A Surprise Gift ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

background:linear-gradient(180deg,#040404,#2b1055,#7597de);

color:white;

}

.stars{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:.2;}
to{opacity:1;}
}

.gift{

font-size:150px;
cursor:pointer;
transition:.6s;

animation:float 3s infinite ease-in-out;

}

@keyframes float{

50%{
transform:translateY(-20px);
}

}

.gift:hover{

transform:scale(1.15);

}

#heart{

display:none;

font-size:170px;

animation:pop 1.2s forwards;

}

@keyframes pop{

0%{

transform:scale(.2);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}

.message{

display:none;

margin-top:30px;

font-size:24px;

text-align:center;

max-width:700px;

padding:20px;

line-height:1.8;

}

button{

display:none;

margin-top:30px;

padding:16px 45px;

border:none;

border-radius:50px;

background:#ff4081;

color:white;

font-size:20px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="stars"></div>

<div id="gift" class="gift">
🎁
</div>

<div id="heart">
❤️
</div>

<div class="message" id="msg">

May every tear become a smile.<br>

May every worry become peace.<br><br>

You deserve happiness every single day.

</div>

<button id="next" onclick="location.href='final.html'">

Final Surprise ✨

</button>

<script>

for(let i=0;i<250;i++){

const s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*3+"s";

document.querySelector(".stars").appendChild(s);

}

document.getElementById("gift").onclick=function(){

this.style.display="none";

document.getElementById("heart").style.display="block";

document.getElementById("msg").style.display="block";

document.getElementById("next").style.display="inline-block";

let msg=new SpeechSynthesisUtterance(

"I hope your beautiful smile always shines brighter than the stars."

);

msg.rate=.9;

speechSynthesis.speak(msg);

};

</script>

</body>
</html>
